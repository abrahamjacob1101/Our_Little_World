
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little World ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 font-family:Arial,sans-serif;color:white;
 background:radial-gradient(ellipse at top,#59345e,#21172e 70%);
}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#title{
 position:absolute;top:15px;width:100%;text-align:center;
 color:#ffd3e9;font-size:23px;font-weight:bold;
 text-shadow:0 0 15px #ff65bb;pointer-events:none;
}
#message{
 position:absolute;top:58px;width:100%;text-align:center;
 color:#ffe4f1;font-size:14px;pointer-events:none;
}
#joy{
 position:absolute;bottom:30px;left:22px;
 width:115px;height:115px;border-radius:50%;
 background:#ffffff35;border:2px solid #ffffff90;
 touch-action:none;
}
#stick{
 position:absolute;left:32px;top:32px;
 width:48px;height:48px;border-radius:50%;
 background:#ffb9dd;box-shadow:0 0 15px #ffb9dd;
}
#actions{
 position:absolute;right:12px;bottom:25px;
 display:grid;grid-template-columns:repeat(2,68px);gap:9px;
}
button{
 border:1px solid #ffffff80;border-radius:20px;
 background:#a95091;color:white;
 padding:13px 3px;font-size:12px;
 box-shadow:0 3px 12px #0005;
}
#status{
 position:absolute;top:90px;left:0;width:100%;
 text-align:center;color:#ffd9ec;font-size:12px;
}
</style>
</head>
<body>

<div id="title">Our Little World ❤️</div>
<div id="message">Our love, our little universe ✨</div>
<div id="status">Entering our magical museum...</div>
<canvas id="game"></canvas>

<div id="joy"><div id="stick"></div></div>

<div id="actions">
<button onclick="react('Sending you a kiss 💋')">💋 Kiss</button>
<button onclick="react('A warm hug for you 🤗')">🤗 Hug</button>
<button onclick="react('Let us dance together 💃')">💃 Dance</button>
<button onclick="react('You look adorable 🥰')">🥰 Blush</button>
<button onclick="react('You make me happy ❤️')">❤️ Happy</button>
<button onclick="react('Come sit beside me 🪑')">🪑 Sit</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
function react(t){
 document.getElementById('message').textContent=t;
}

const canvas=document.getElementById('game');
const status=document.getElementById('status');

if(typeof THREE==='undefined'){
 status.textContent='3D library could not load. Check your internet connection.';
}else{
 try{
 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x30203d);
 scene.fog=new THREE.Fog(0x30203d,18,45);

 const camera=new THREE.PerspectiveCamera(
  65,innerWidth/innerHeight,0.1,100
 );

 const renderer=new THREE.WebGLRenderer({
  canvas:canvas,antialias:true,alpha:false
 });
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setClearColor(0x30203d);

 scene.add(new THREE.HemisphereLight(0xffd6ef,0x45304f,2));

 const light=new THREE.PointLight(0xffa8db,3,35);
 light.position.set(0,8,0);
 scene.add(light);

 function box(w,h,d,x,y,z,color){
  const obj=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({color:color})
  );
  obj.position.set(x,y,z);
  scene.add(obj);
  return obj;
 }

 // Beautiful museum floor
 box(30,.3,30,0,-.2,0,0x78516e);

 // Museum walls
 box(30,9,.4,0,4.3,-15,0x65436c);
 box(.4,9,30,-15,4,0,0x65436c);
 box(.4,9,30,15,4,0,0x65436c);

 // Decorative pillars
 for(let x=-12;x<=12;x+=6){
  box(.65,7,.65,x,3.3,-10,0xe6a9d0);
 }

 // Picture frames
 for(let x=-10;x<=10;x+=5){
  box(2.7,2.7,.2,x,3,-14.7,0xf4c1de);
  box(2.3,2.3,.15,x,3,-14.5,0x45304e);
  box(1.9,1.9,.08,x,3,-14.35,0xb67ca7);
 }

 // Glowing decorative orbs
 for(let i=0;i<18;i++){
  const orb=new THREE.Mesh(
   new THREE.SphereGeometry(.12,12,12),
   new THREE.MeshBasicMaterial({color:0xffc5e6})
  );
  orb.position.set(
   Math.sin(i*2)*11,
   2+Math.random()*5,
   -12+Math.random()*20
  );
  scene.add(orb);
 }

 // Romantic bench
 box(3,.25,.9,0,.8,-3,0xe7a4c9);
 box(3,.2,.25,0,1.5,-3.35,0xe7a4c9);
 box(.18,.8,.18,-1.2,.4,-3,0x65436c);
 box(.18,.8,.18,1.2,.4,-3,0x65436c);

 // Player character
 const player=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.4,1,20),
  new THREE.MeshStandardMaterial({color:0x9dc9ff})
 );
 body.position.y=1;
 player.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.35,24,24),
  new THREE.MeshStandardMaterial({color:0xffd6bd})
 );
 head.position.y=1.8;
 player.add(head);

 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.36,24,16,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x38242e})
 );
 hair.position.y=2;
 player.add(hair);

 scene.add(player);
 player.position.set(0,0,5);

 camera.position.set(0,5,12);
 camera.lookAt(0,1,0);

 let mx=0,my=0;

 const joy=document.getElementById('joy');
 const stick=document.getElementById('stick');

 function move(e){
  const r=joy.getBoundingClientRect();
  let x=e.clientX-r.left-r.width/2;
  let y=e.clientY-r.top-r.height/2;
  const len=Math.hypot(x,y);
  if(len>35){x=x/len*35;y=y/len*35}
  stick.style.left=(32+x)+'px';
  stick.style.top=(32+y)+'px';
  mx=x/35;my=y/35;
 }

 function stop(){
  mx=0;my=0;
  stick.style.left='32px';
  stick.style.top='32px';
 }

 joy.addEventListener('pointerdown',e=>{
  joy.setPointerCapture(e.pointerId);
  move(e);
 });
 joy.addEventListener('pointermove',e=>{
  if(e.buttons)move(e);
 });
 joy.addEventListener('pointerup',stop);
 joy.addEventListener('pointercancel',stop);

 status.textContent='✨ Museum loaded! Explore your world.';

 function animate(){
  requestAnimationFrame(animate);

  player.position.x+=mx*.07;
  player.position.z+=my*.07;

  player.position.x=Math.max(-13,Math.min(13,player.position.x));
  player.position.z=Math.max(-13,Math.min(13,player.position.z));

  camera.position.x=player.position.x;
  camera.position.z=player.position.z+7;
  camera.lookAt(player.position.x,1,player.position.z);

  renderer.render(scene,camera);
 }
 animate();

 window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
 });

 }catch(error){
  status.textContent='3D error: '+error.message;
 }
}
</script>
</body>
</html>
