<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Little World ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #24152e;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#title {
  position: absolute;
  top: 15px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 21px;
  font-weight: bold;
  text-shadow: 0 0 15px #ff4da6;
  pointer-events: none;
  z-index: 5;
}

#message {
  position: absolute;
  top: 55px;
  width: 100%;
  text-align: center;
  color: #fff0fa;
  font-size: 14px;
  pointer-events: none;
  z-index: 5;
}

#joy {
  position: absolute;
  bottom: 35px;
  left: 28px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: #ffffff30;
  border: 3px solid #ffffff90;
  z-index: 10;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 48px;
  height: 48px;
  background: #ff9ed5;
  border-radius: 50%;
  left: 35px;
  top: 35px;
  box-shadow: 0 0 20px #ff6bc4;
  pointer-events: none;
}

#actions {
  position: absolute;
  bottom: 25px;
  right: 12px;
  width: 48%;
  max-width: 280px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  z-index: 10;
}

button {
  min-height: 51px;
  border: 2px solid #ffffff80;
  border-radius: 30px;
  background: #a84991;
  color: white;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 4px 12px #0004;
  touch-action: manipulation;
  cursor: pointer;
}

button:active {
  background: #e66bb8;
  transform: scale(.95);
}

#cameraHint {
  position: absolute;
  top: 85px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff;
  opacity: .8;
  font-size: 11px;
  pointer-events: none;
}

#status {
  position: absolute;
  top: 110px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 13px;
  pointer-events: none;
}

@media(max-height: 600px) {
  #joy {
    width: 95px;
    height: 95px;
    bottom: 15px;
    left: 15px;
  }
  #stick {
    left: 24px;
    top: 24px;
  }
  #actions {
    bottom: 12px;
  }
  button {
    min-height: 39px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div id="title">Our Little World ❤️</div>
<div id="message">Welcome to our romantic museum ✨</div>
<div id="cameraHint">Drag the museum screen to rotate the camera</div>
<div id="status">Explore your little world together 💗</div>

<canvas id="game"></canvas>

<div id="joy">
  <div id="stick"></div>
</div>

<div id="actions">
  <button onclick="react('kiss')">💋 Kiss</button>
  <button onclick="react('hug')">🤗 Hug</button>
  <button onclick="react('dance')">💃 Dance</button>
  <button onclick="react('blush')">🥰 Blush</button>
  <button onclick="react('happy')">❤️ Happy</button>
  <button onclick="react('sit')">🪑 Sit</button>
  <button onclick="react('wave')">👋 Wave</button>
  <button onclick="react('stand')">✨ Stand</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
if (!window.THREE) {
  document.getElementById("status").textContent =
    "3D library failed to load. Please check your internet connection.";
  throw new Error("Three.js not loaded");
}

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6b326c);
scene.fog = new THREE.Fog(0x6b326c, 18, 42);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 100
);

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("game"),
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffdafa, 0x56324b, 2));

const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
mainLight.position.set(5, 12, 8);
mainLight.castShadow = true;
scene.add(mainLight);

const pinkLight = new THREE.PointLight(0xff65c7, 90, 20);
pinkLight.position.set(0, 5, 0);
scene.add(pinkLight);

const warmLight = new THREE.PointLight(0xffd5a8, 70, 18);
warmLight.position.set(-7, 4, -5);
scene.add(warmLight);

// MATERIALS
function mat(color, roughness = 0.75) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const floorMat = mat(0xeeb5df);
const wallMat = mat(0xd96ac5);
const whiteMat = mat(0xffe9fa);
const goldMat = mat(0xd9a44c, 0.4);
const darkMat = mat(0x52244f);

// BOX CREATOR
function box(x,y,z,w,h,d,material) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// MUSEUM FLOOR
box(0,-0.2,0,24,0.4,30,floorMat);

// MUSEUM WALLS
box(0,5,-15,24,10,0.5,wallMat);
box(-12,5,0,0.5,10,30,wallMat);
box(12,5,0,0.5,10,30,wallMat);

// CEILING
box(0,10,0,24,0.3,30,mat(0xf3a5dd));

// WALL DECORATIONS
function frame(x,y,z,rotation=0) {
  const group = new THREE.Group();

  const border = new THREE.Mesh(
    new THREE.BoxGeometry(2.2,2.6,0.18),goldMat
  );

  const inner = new THREE.Mesh(
    new THREE.BoxGeometry(1.9,2.3,0.1),whiteMat
  );
  inner.position.z = 0.12;

  const picture = new THREE.Mesh(
    new THREE.BoxGeometry(1.65,2.05,0.06),
    mat(0xffb2dc)
  );
  picture.position.z = 0.19;

  group.add(border,inner,picture);
  group.position.set(x,y,z);
  group.rotation.y = rotation;
  scene.add(group);
}

for(let i=0;i<5;i++){
  frame(-9+i*4.5,5,-14.65);
}

for(let i=0;i<5;i++){
  frame(-11.65,5,-10+i*5,Math.PI/2);
  frame(11.65,5,-10+i*5,-Math.PI/2);
}

// PILLARS
for(let x of [-9,-5,5,9]){
  box(x,4,0,0.45,8,0.45,whiteMat);
}

// DECORATIVE HEARTS
function heart(x,y,z) {
  const group = new THREE.Group();

  const a = new THREE.Mesh(
    new THREE.SphereGeometry(.35,16,16),
    mat(0xff4d9f)
  );
  const b = a.clone();
  a.position.x = -.2;
  b.position.x = .2;

  const bottom = new THREE.Mesh(
    new THREE.ConeGeometry(.34,.65,16),
    mat(0xff4d9f)
  );
  bottom.rotation.z = Math.PI;
  bottom.position.y = -.38;

  group.add(a,b,bottom);
  group.position.set(x,y,z);
  scene.add(group);
}

heart(-8,7,-14.3);
heart(8,7,-14.3);

// BENCH
const benchMat = mat(0x8c3c78);
box(0,1,-5,3,0.25,1,benchMat);
box(0,1.8,-5.45,3,1.5,.2,benchMat);

for(let x of [-1.25,1.25]){
  box(x,.45,-4.7,.18,.9,.18,goldMat);
  box(x,.45,-5.3,.18,.9,.18,goldMat);
}

// CHARACTER CREATOR
function createCharacter(bodyColor,hairColor) {
  const root = new THREE.Group();

  const skin = mat(0xffd0b6);
  const bodyMaterial = mat(bodyColor);
  const hair = mat(hairColor);
  const shoes = mat(0x50254d);
  const eyes = mat(0x30202b);

  function sphere(parent,x,y,z,sx,sy,sz,material) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(1,20,16),material
    );
    m.position.set(x,y,z);
    m.scale.set(sx,sy,sz);
    m.castShadow = true;
    parent.add(m);
    return m;
  }

  // BODY
  const body = new THREE.Group();
  body.position.y = 1.25;
  root.add(body);

  sphere(body,0,0,0,.43,.58,.27,bodyMaterial);

  // NECK
  sphere(body,0,.62,0,.15,.19,.15,skin);

  // HEAD
  const head = new THREE.Group();
  head.position.y = .95;
  body.add(head);

  sphere(head,0,.12,0,.48,.53,.42,skin);

  // HAIR
  sphere(head,0,.48,-.03,.49,.28,.43,hair);

  // FRONT HAIR
  sphere(head,0,.48,.27,.4,.16,.18,hair);

  // EYES
  sphere(head,-.17,.16,.38,.045,.075,.025,eyes);
  sphere(head,.17,.16,.38,.045,.075,.025,eyes);

  // CHEEKS
  const cheekMat = new THREE.MeshBasicMaterial({
    color:0xff8da9,
    transparent:true,
    opacity:.7
  });

  const leftCheek = sphere(head,-.31,.02,.34,.1,.055,.025,cheekMat);
  const rightCheek = sphere(head,.31,.02,.34,.1,.055,.025,cheekMat);

  // SMILE
  const smile = new THREE.Mesh(
    new THREE.TorusGeometry(.09,.018,8,20,Math.PI),
    eyes
  );
  smile.position.set(0,-.03,.39);
  smile.rotation.z = Math.PI;
  head.add(smile);

  // ARMS
  const arms = [];

  for(let side of [-1,1]){
    const arm = new THREE.Group();
    arm.position.set(side*.43,.36,0);
    body.add(arm);

    sphere(arm,0,-.3,0,.14,.38,.14,bodyMaterial);
    sphere(arm,0,-.65,.02,.13,.13,.13,skin);
    arms.push(arm);
  }

  // LEGS
  const legs = [];

  for(let side of [-1,1]){
    const leg = new THREE.Group();
    leg.position.set(side*.2,-.48,0);
    root.add(leg);

    sphere(leg,0,-.4,0,.19,.48,.2,bodyMaterial);
    sphere(leg,0,-.85,.08,.2,.13,.3,shoes);

    legs.push(leg);
  }

  root.position.y=0;
  scene.add(root);

  return {
    root,body,head,arms,legs,
    leftCheek,rightCheek,
    baseY:0,
    action:"stand",
    actionStart:0,
    moving:false,
    phase:Math.random()*5
  };
}

// TWO CHARACTERS
const player = createCharacter(0x6796ff,0x342044);
const partner = createCharacter(0xff70bc,0x50233d);

player.root.position.set(-1,0,3);
partner.root.position.set(1,0,-1);
partner.root.rotation.y=Math.PI;

// MOVEMENT SETTINGS
let joyX=0;
let joyY=0;
let cameraAngle=0;
let cameraHeight=4.5;
let cameraDistance=8;
let cameraDragging=false;
let previousX=0;
let previousY=0;

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

// JOYSTICK TOUCH CONTROL
let joyPointer=null;

function moveStick(e){
  if(joyPointer!==e.pointerId)return;

  const rect=joy.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  let dx=e.clientX-cx;
  let dy=e.clientY-cy;

  const max=43;
  const length=Math.sqrt(dx*dx+dy*dy);

  if(length>max){
    dx=dx/length*max;
    dy=dy/length*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}

joy.addEventListener("pointerdown",e=>{
  e.preventDefault();
  joyPointer=e.pointerId;
  joy.setPointerCapture(e.pointerId);
  moveStick(e);
});

joy.addEventListener("pointermove",e=>{
  if(joyPointer===e.pointerId){
    e.preventDefault();
    moveStick(e);
  }
});

function resetJoy(){
  joyPointer=null;
  joyX=0;
  joyY=0;
  stick.style.transform="translate(0px,0px)";
}

joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);
joy.addEventListener("lostpointercapture",resetJoy);

// CAMERA ROTATION BY DRAGGING SCREEN
renderer.domElement.addEventListener("pointerdown",e=>{
  cameraDragging=true;
  previousX=e.clientX;
  previousY=e.clientY;
});

window.addEventListener("pointermove",e=>{
  if(!cameraDragging)return;

  const dx=e.clientX-previousX;
  const dy=e.clientY-previousY;

  cameraAngle-=dx*.006;
  cameraHeight-=dy*.018;
  cameraHeight=Math.max(2.5,Math.min(8,cameraHeight));

  previousX=e.clientX;
  previousY=e.clientY;
});

window.addEventListener("pointerup",()=>{
  cameraDragging=false;
});

renderer.domElement.addEventListener("wheel",e=>{
  cameraDistance+=e.deltaY*.008;
  cameraDistance=Math.max(4,Math.min(13,cameraDistance));
});

// KEYBOARD CONTROL
const keys={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

// REACTIONS
const message=document.getElementById("message");

function react(type){
  player.action=type;
  player.actionStart=performance.now()/1000;

  if(type==="kiss"){
    message.textContent="Sending you a kiss 💋";
    heartParticles();
  }
  if(type==="hug"){
    message.textContent="Come here, my love 🤗";
    heartParticles();
  }
  if(type==="dance")message.textContent="Let's dance together 💃";
  if(type==="blush")message.textContent="Feeling shy 🥰";
  if(type==="happy")message.textContent="You make me happy ❤️";
  if(type==="sit")message.textContent="Let's sit together 🪑";
  if(type==="wave")message.textContent="Hello my love 👋";
  if(type==="stand")message.textContent="Standing beside you ✨";

  if(type==="sit"){
    player.root.position.x=0;
    player.root.position.z=-3.5;
  }

  if(type==="hug" || type==="kiss"){
    partner.action=type;
    partner.actionStart=performance.now()/1000;
  }
}

// HEART PARTICLES
const particles=[];

function heartParticles(){
  for(let i=0;i<9;i++){
    const p=new THREE.Mesh(
      new THREE.SphereGeometry(.13,10,10),
      new THREE.MeshBasicMaterial({color:0xff4da6})
    );

    p.position.copy(player.root.position);
    p.position.y+=2.6;
    p.velocity=new THREE.Vector3(
      (Math.random()-.5)*2,
      1+Math.random()*2,
      (Math.random()-.5)*2
    );

    scene.add(p);
    particles.push({mesh:p,life:2});
  }
}

// ANIMATION ENGINE
const clock=new THREE.Clock();

function animateCharacter(c,time,delta){
  const elapsed=time-c.actionStart;

  c.root.position.y=c.baseY;
  c.body.rotation.set(0,0,0);
  c.head.rotation.set(0,0,0);

  c.arms.forEach(a=>a.rotation.set(0,0,0));
  c.legs.forEach(l=>l.rotation.set(0,0,0));

  c.leftCheek.scale.set(.1,.055,.025);
  c.rightCheek.scale.set(.1,.055,.025);

  // WALKING
  if(c.moving){
    c.legs[0].rotation.x=Math.sin(time*10)*.55;
    c.legs[1].rotation.x=-Math.sin(time*10)*.55;

    c.arms[0].rotation.x=-Math.sin(time*10)*.45;
    c.arms[1].rotation.x=Math.sin(time*10)*.45;

    c.root.position.y=Math.abs(Math.sin(time*10))*.08;
  }

  // DANCE
  if(c.action==="dance" && elapsed<5){
    c.root.position.y=Math.abs(Math.sin(time*9))*.4;
    c.body.rotation.z=Math.sin(time*7)*.25;
    c.arms[0].rotation.z=-1.8;
    c.arms[1].rotation.z=1.8;
    c.legs[0].rotation.x=Math.sin(time*8)*.6;
    c.legs[1].rotation.x=-Math.sin(time*8)*.6;
  }

  // HUG
  else if(c.action==="hug" && elapsed<2.5){
    c.arms[0].rotation.z=-1.5;
    c.arms[1].rotation.z=1.5;
    c.body.rotation.x=-.18;
    c.head.rotation.x=-.2;
  }

  // KISS
  else if(c.action==="kiss" && elapsed<2){
    c.body.rotation.x=-.3;
    c.head.rotation.x=-.45;
    c.arms[0].rotation.z=-.7;
    c.arms[1].rotation.z=.7;
  }

  // BLUSH
  else if(c.action==="blush" && elapsed<3){
    c.head.rotation.z=Math.sin(time*3)*.15;
    c.head.rotation.x=.2;
    c.leftCheek.scale.set(.17,.1,.04);
    c.rightCheek.scale.set(.17,.1,.04);
  }

  // HAPPY
  else if(c.action==="happy" && elapsed<2.5){
    c.root.position.y=Math.abs(Math.sin(time*7))*.55;
    c.arms[0].rotation.z=-2;
    c.arms[1].rotation.z=2;
  }

  // SIT
  else if(c.action==="sit"){
    c.root.position.y=-.25;
    c.legs[0].rotation.x=-1.1;
    c.legs[1].rotation.x=-1.1;
    c.body.rotation.x=.15;
    c.arms[0].rotation.x=-.4;
    c.arms[1].rotation.x=-.4;
  }

  // WAVE
  else if(c.action==="wave" && elapsed<3){
    c.arms[1].rotation.z=2.5;
    c.arms[1].rotation.x=Math.sin(time*9)*.7;
  }

  // STAND
  else if(c.action==="stand"){
    c.body.position.y=1.25;
  }

  // Return to normal after temporary reactions
  if(elapsed>5 && c.action!=="sit"){
    c.action="stand";
  }
}

// MAIN GAME LOOP
function update(){
  requestAnimationFrame(update);

  const delta=Math.min(clock.getDelta(),.05);
  const time=clock.elapsedTime;

  // JOYSTICK AND KEYBOARD INPUT
  let x=joyX;
  let y=joyY;

  if(keys["a"]||keys["arrowleft"])x=-1;
  if(keys["d"]||keys["arrowright"])x=1;
  if(keys["w"]||keys["arrowup"])y=-1;
  if(keys["s"]||keys["arrowdown"])y=1;

  const inputLength=Math.sqrt(x*x+y*y);
  if(inputLength>1){
    x/=inputLength;
    y/=inputLength;
  }

  const speed=4.2;

  const forwardX=-Math.sin(cameraAngle);
  const forwardZ=-Math.cos(cameraAngle);

  const rightX=Math.cos(cameraAngle);
  const rightZ=-Math.sin(cameraAngle);

  const dx=(rightX*x+forwardX*(-y))*speed*delta;
  const dz=(rightZ*x+forwardZ*(-y))*speed*delta;

  if(Math.abs(x)+Math.abs(y)>.05 && player.action!=="sit"){
    player.root.position.x+=dx;
    player.root.position.z+=dz;

    player.root.position.x=THREE.MathUtils.clamp(
      player.root.position.x,-10.5,10.5
    );

    player.root.position.z=THREE.MathUtils.clamp(
      player.root.position.z,-13,12
    );

    player.root.rotation.y=Math.atan2(dx,dz);
    player.moving=true;
  }else{
    player.moving=false;
  }

  // CHARACTER ANIMATIONS
  animateCharacter(player,time,delta);
  animateCharacter(partner,time,delta);

  // FOLLOW CAMERA
  const target=player.root.position;

  const cameraX=target.x+Math.sin(cameraAngle)*cameraDistance;
  const cameraZ=target.z+Math.cos(cameraAngle)*cameraDistance;

  camera.position.lerp(
    new THREE.Vector3(
      cameraX,
      target.y+cameraHeight,
      cameraZ
    ),.09
  );

  camera.lookAt(target.x,target.y+1.4,target.z);

  // PARTICLES
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.mesh.position.addScaledVector(p.mesh.velocity,delta);
    p.mesh.velocity.y-=1.5*delta;
    p.life-=delta;

    if(p.life<=0){
      scene.remove(p.mesh);
      particles.splice(i,1);
    }
  }

  // LIGHT ANIMATION
  pinkLight.intensity=85+Math.sin(time*2)*12;

  renderer.render(scene,camera);
}

// INITIAL CAMERA
camera.position.set(0,5,11);
camera.lookAt(0,1,0);

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

update();

</script>
</body>
</html>
