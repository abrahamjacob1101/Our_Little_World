<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Little World ❤️</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#21172e;color:white;font-family:Arial}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#title{position:absolute;top:12px;width:100%;text-align:center;font-size:22px;color:#ffd2eb;text-shadow:0 0 12px #ff55b5;pointer-events:none}
#message{position:absolute;top:48px;width:100%;text-align:center;color:#ffe5f2;font-size:14px;pointer-events:none}
#status{position:absolute;top:72px;width:100%;text-align:center;font-size:11px;color:#eac5e7;pointer-events:none}
#joy{position:absolute;bottom:25px;left:20px;width:115px;height:115px;border-radius:50%;background:#ffffff25;border:2px solid #ffffff80;touch-action:none}
#stick{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:#ffb5dc;box-shadow:0 0 15px #ff8bc9}
#actions{position:absolute;right:10px;bottom:20px;display:grid;grid-template-columns:repeat(2,68px);gap:8px}
button{border:1px solid #ffffff70;border-radius:18px;background:#a54e91;color:white;padding:12px 2px;font-size:12px;box-shadow:0 3px 12px #0005}
#cameraHint{position:absolute;top:100px;width:100%;text-align:center;font-size:10px;color:#ffffff99;pointer-events:none}
</style>
</head>

<body>

<div id="title">Our Little World ❤️</div>
<div id="message">A little universe made for us ✨</div>
<div id="status">Welcome to our museum</div>
<div id="cameraHint">Drag the screen to look around</div>

<canvas id="game"></canvas>

<div id="joy"><div id="stick"></div></div>

<div id="actions">
<button onclick="act('kiss')">💋 Kiss</button>
<button onclick="act('hug')">🤗 Hug</button>
<button onclick="act('dance')">💃 Dance</button>
<button onclick="act('blush')">🥰 Blush</button>
<button onclick="act('happy')">❤️ Happy</button>
<button onclick="act('sit')">🪑 Sit</button>
<button onclick="act('wave')">👋 Wave</button>
<button onclick="act('idle')">✨ Stand</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
const msg=document.getElementById('message');
const status=document.getElementById('status');

if(!window.THREE){
 status.textContent='3D library unavailable. Check internet and reload.';
}else{

try{

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x30203f);
scene.fog=new THREE.Fog(0x30203f,22,65);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);

const renderer=new THREE.WebGLRenderer({
 canvas:document.getElementById('game'),
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.8;

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffd6ed,0x30243f,1.7));

const warm=new THREE.PointLight(0xffa5d8,2.2,35);
warm.position.set(0,8,0);
scene.add(warm);

const gold=new THREE.PointLight(0xffcf9b,1.5,25);
gold.position.set(-8,5,-5);
scene.add(gold);

function mat(color,roughness=.8){
 return new THREE.MeshStandardMaterial({color,roughness});
}

function block(w,h,d,x,y,z,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(color)
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

function sphere(parent,r,x,y,z,color){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(r,20,16),
  mat(color)
 );
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

// MUSEUM FLOOR

block(34,.35,34,0,-.25,0,0x765474);

// MUSEUM WALLS

block(34,10,.5,0,4.8,-17,0x53375f);
block(.5,10,34,-17,4.8,0,0x53375f);
block(.5,10,34,17,4.8,0,0x53375f);

// DECORATIVE PILLARS

for(let x=-14;x<=14;x+=7){
 block(.55,8,.55,x,3.8,-13,0xd49ac2);
 block(.55,8,.55,x,3.8,13,0xd49ac2);
}

// MEMORY FRAMES

for(let x=-12;x<=12;x+=6){
 block(3,3,.2,x,3.7,-16.5,0xf0bfdc);
 block(2.55,2.55,.12,x,3.7,-16.3,0x44304e);
 block(2.2,2.2,.08,x,3.7,-16.15,0xa77aab);
}

// DECORATIVE LIGHTS

for(let i=0;i<22;i++){
 const lightBall=new THREE.Mesh(
  new THREE.SphereGeometry(.09,12,12),
  new THREE.MeshBasicMaterial({color:0xffd6a0})
 );
 lightBall.position.set(
  -13+(i%11)*2.6,
  6+(i%3)*.5,
  -12+Math.floor(i/11)*8
 );
 scene.add(lightBall);
}

// BENCH

const bench=new THREE.Group();

function benchPart(w,h,d,x,y,z,c){
 const o=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(c)
 );
 o.position.set(x,y,z);
 bench.add(o);
}

benchPart(3,.25,.9,0,.9,0,0xd99bc2);
benchPart(3,.22,.2,0,1.45,-.35,0xd99bc2);

for(let x of [-1.2,1.2]){
 benchPart(.16,.8,.16,x,.4,0,0x765174);
}

bench.position.set(0,0,-3);
scene.add(bench);

// DECORATIVE FLOWERS

for(let x of [-11,-8,8,11]){
 block(.13,1,.13,x,.5,3,0x64875d);
 sphere(scene,.38,x,1.2,3,0xff9dcf);
 sphere(scene,.2,x+.25,1.35,3,0xffd2e9);
}

// CHARACTER CREATION

function createCharacter(color,hairColor){

 const root=new THREE.Group();
 const model=new THREE.Group();
 root.add(model);

 const skin=mat(0xffd2bd);
 const outfit=mat(color);
 const hairMat=mat(hairColor);
 const dark=mat(0x30202a);

 // BODY

 const torso=new THREE.Mesh(
  new THREE.CylinderGeometry(.38,.32,.85,16),
  outfit
 );
 torso.position.y=1.35;
 model.add(torso);

 // NECK

 const neck=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.14,.2,12),
  skin
 );
 neck.position.y=1.82;
 model.add(neck);

 // HEAD

 const head=new THREE.Group();
 head.position.y=2.18;
 model.add(head);

 sphere(head,.38,0,0,0,0xffd2bd);

 // HAIR

 const cap=new THREE.Mesh(
  new THREE.SphereGeometry(.39,20,16,0,Math.PI*2,0,Math.PI/2),
  hairMat
 );
 cap.position.y=.12;
 head.add(cap);

 sphere(head,.22,-.19,.13,.16,hairColor);
 sphere(head,.2,.17,.12,.18,hairColor);

 // EYES

 sphere(head,.045,-.13,-.34,.02,0x38212b);
 sphere(head,.045,.13,-.34,.02,0x38212b);

 // SMILE

 const smile=new THREE.Mesh(
  new THREE.TorusGeometry(.09,.018,8,16,Math.PI),
  dark
 );
 smile.position.set(0,-.14,-.35);
 smile.rotation.z=Math.PI;
 head.add(smile);

 // ARMS

 const arms=[];

 for(let side of [-1,1]){

  const pivot=new THREE.Group();
  pivot.position.set(side*.43,1.65,0);
  model.add(pivot);

  const arm=new THREE.Mesh(
   new THREE.CylinderGeometry(.12,.10,.65,12),
   skin
  );
  arm.position.y=-.36;
  pivot.add(arm);

  sphere(pivot,.13,0,-.72,0,0xffd2bd);

  arms.push(pivot);
 }

 // LEGS

 const legs=[];

 for(let side of [-1,1]){

  const pivot=new THREE.Group();
  pivot.position.set(side*.2,.82,0);
  model.add(pivot);

  const leg=new THREE.Mesh(
   new THREE.CylinderGeometry(.16,.13,.65,12),
   outfit
  );
  leg.position.y=-.37;
  pivot.add(leg);

  const shoe=new THREE.Mesh(
   new THREE.SphereGeometry(.19,12,12),
   mat(0xf2d4e6)
  );
  shoe.position.set(0,-.72,-.06);
  pivot.add(shoe);

  legs.push(pivot);
 }

 // BLUSH

 const cheeks=[];

 for(let side of [-1,1]){
  const cheek=new THREE.Mesh(
   new THREE.SphereGeometry(.07,12,12),
   new THREE.MeshBasicMaterial({
    color:0xff629d,
    transparent:true,
    opacity:0
   })
  );
  cheek.position.set(side*.24,-.1,-.3);
  head.add(cheek);
  cheeks.push(cheek);
 }

 return {root,model,head,arms,legs,cheeks};
}

// CREATE PLAYER

const player=createCharacter(0x8db7ed,0x493044);

scene.add(player.root);
player.root.position.set(0,0,5);

// ACTION SYSTEM

let action='idle';
let actionStart=0;
let actionLength=2.5;

function act(name){

 action=name;
 actionStart=performance.now()/1000;

 const labels={
  kiss:'Sending a sweet kiss 💋',
  hug:'A warm hug for you 🤗',
  dance:'Dancing in our little world 💃',
  blush:'You make me blush 🥰',
  happy:'So happy with you ❤️',
  sit:'Enjoying our little bench 🪑',
  wave:'Hello, my love! 👋',
  idle:'Ready to explore ✨'
 };

 msg.textContent=labels[name]||name;

 if(name==='sit'){
  player.root.position.set(0,0,-3);
  player.root.rotation.y=Math.PI;
 }
}

// JOYSTICK

let mx=0,my=0;

const joy=document.getElementById('joy');
const stick=document.getElementById('stick');

function joyMove(e){

 const r=joy.getBoundingClientRect();

 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;

 const len=Math.hypot(x,y);

 if(len>36){
  x=x/len*36;
  y=y/len*36;
 }

 mx=x/36;
 my=y/36;

 stick.style.left=32+x+'px';
 stick.style.top=32+y+'px';
}

function joyStop(){

 mx=0;
 my=0;

 stick.style.left='32px';
 stick.style.top='32px';
}

joy.addEventListener('pointerdown',e=>{
 joy.setPointerCapture(e.pointerId);
 joyMove(e);
});

joy.addEventListener('pointermove',e=>{
 if(e.buttons)joyMove(e);
});

joy.addEventListener('pointerup',joyStop);
joy.addEventListener('pointercancel',joyStop);

// CAMERA ROTATION

let yaw=Math.PI;
let pitch=.25;

let dragging=false;
let lastX=0;
let lastY=0;
let dragPointer=null;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 dragPointer=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
});

renderer.domElement.addEventListener('pointermove',e=>{

 if(!dragging||e.pointerId!==dragPointer)return;

 yaw-=(e.clientX-lastX)*.008;
 pitch+=(e.clientY-lastY)*.004;

 pitch=Math.max(-.1,Math.min(.8,pitch));

 lastX=e.clientX;
 lastY=e.clientY;
});

function endDrag(){
 dragging=false;
 dragPointer=null;
}

renderer.domElement.addEventListener('pointerup',endDrag);
renderer.domElement.addEventListener('pointercancel',endDrag);

// HEART PARTICLES

const hearts=[];

function heartParticle(){

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.1,8,8),
  new THREE.MeshBasicMaterial({
   color:0xff83c6,
   transparent:true
  })
 );

 h.position.set(
  player.root.position.x+(Math.random()-.5),
  2.5,
  player.root.position.z
 );

 scene.add(h);
 hearts.push({mesh:h,life:1});
}

let lastHeart=0;

// GAME LOOP

const clock=new THREE.Clock();

let walkTime=0;

function animate(){

 requestAnimationFrame(animate);

 const t=clock.getElapsedTime();

 const moving=Math.abs(mx)+Math.abs(my)>.1;

 if(moving){

  action='walk';
  walkTime+=.12;

  player.root.position.x+=
   Math.sin(yaw)*my*.09+
   Math.cos(yaw)*mx*.09;

  player.root.position.z+=
   Math.cos(yaw)*my*.09-
   Math.sin(yaw)*mx*.09;

  player.root.rotation.y=Math.atan2(mx,-my)+yaw;

 }else if(action==='walk'){
  action='idle';
 }

 player.root.position.x=Math.max(-15,Math.min(15,player.root.position.x));
 player.root.position.z=Math.max(-15,Math.min(15,player.root.position.z));

 const a=t-actionStart;
 const model=player.model;

 // LEG ANIMATION

 player.legs.forEach((leg,i)=>{

  leg.rotation.x=0;

  if(action==='walk'&&moving){
   leg.rotation.x=Math.sin(walkTime+i*Math.PI)*.65;
  }

  if(action==='dance'){
   leg.rotation.x=Math.sin(a*9+i*Math.PI)*.65;
  }

  if(action==='sit'){
   leg.rotation.x=-1.1;
  }
 });

 // ARM ANIMATION

 player.arms.forEach((arm,i)=>{

  arm.rotation.set(0,0,i===0?-.12:.12);

  if(action==='wave'&&i===1){
   arm.rotation.z=-2.3+Math.sin(a*8)*.3;
  }

  if(action==='hug'||action==='happy'){
   arm.rotation.z=i===0?1.1:-1.1;
  }

  if(action==='kiss'&&i===1){
   arm.rotation.z=-1.3;
  }

  if(action==='dance'){
   arm.rotation.z=(i===0?1:-1)+Math.sin(a*8)*.4;
  }

  if(action==='sit'){
   arm.rotation.z=i===0?.2:-.2;
  }
 });

 // BODY ANIMATION

 model.position.y=0;
 model.rotation.z=0;

 if(action==='dance'){
  model.position.y=Math.abs(Math.sin(a*7))*.18;
  model.rotation.z=Math.sin(a*5)*.14;
 }

 if(action==='happy'){
  model.position.y=Math.abs(Math.sin(a*9))*.22;
 }

 if(action==='blush'){
  model.position.y=Math.sin(a*3)*.04;
 }

 if(action==='sit'){
  model.position.y=-.35;
 }

 // HEAD ANIMATION

 if(action==='kiss'){
  player.head.rotation.x=-.22;

  if(t-lastHeart>.35){
   heartParticle();
   lastHeart=t;
  }

 }else{
  player.head.rotation.x=0;
 }

 if(action==='hug'||action==='wave'){
  player.head.rotation.z=Math.sin(a*3)*.08;
 }else{
  player.head.rotation.z=0;
 }

 // BLUSH ANIMATION

 const visibleBlush=action==='blush'&&a<3;

 player.cheeks.forEach(c=>{
  c.material.opacity=visibleBlush?.9:0;
 });

 // RETURN TO STANDING

 if(action!=='walk'&&action!=='sit'&&a>actionLength){
  action='idle';
 }

 // FOLLOW CAMERA

 const distance=7;

 const target=new THREE.Vector3(
  player.root.position.x,
  1.4,
  player.root.position.z
 );

 camera.position.set(
  target.x+Math.sin(yaw)*distance,
  target.y+2+pitch*4,
  target.z+Math.cos(yaw)*distance
 );

 camera.lookAt(target);

 // HEART MOVEMENT

 for(let i=hearts.length-1;i>=0;i--){

  const h=hearts[i];

  h.mesh.position.y+=.025;
  h.life-=.018;
  h.mesh.material.opacity=Math.max(0,h.life);

  if(h.life<=0){
   scene.remove(h.mesh);
   hearts.splice(i,1);
  }
 }

 renderer.render(scene,camera);
}

animate();

status.textContent='✨ Museum ready • Drag screen to rotate camera';

// SCREEN RESIZE

window.addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

}catch(error){

 console.error(error);
 status.textContent='Game error: '+error.message;

}

}
</script>

</body>
</html>
